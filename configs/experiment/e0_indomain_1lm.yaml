# @package _global_
# H1's single-frame arm. Same OOD rotations, same objects as e1_ood_max, but
# ONE learning module: no voting at all. Without this, H1 is untested.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: evidence_1lm_nn10_dod003
  - /monty/sensor_module: camera_dist_noise_raw1
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_ycb_dist_agent
  - /env_interface: eval_distinctobj_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: basic_warning_monty_runs

polybrains:
  eval_rotations:
    - [0, 0, 0]
    - [0, 90, 0]
    - [0, 270, 0]
    - [90, 0, 0]

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 20000
    n_train_epochs: 1
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}}/polybrains/pb_indomain_1lm/pretrained/
    n_eval_epochs: 1
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: []
    eval_env_interface_args:
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations: ${polybrains.eval_rotations}
    logging:
      run_name: e0_indomain_1lm
      monty_handlers:
        - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler}
