# @package _global_
# P9 -- iterated voting: vote, then vote on the result of that vote.
#
# This arm runs 2 vote exchange(s) per step. Because receive_votes() mutates
# the receiving module's evidence, round r>1 re-reads the ALREADY-VOTED state,
# so it votes on the previous round's result rather than re-tallying the same
# votes.
#
# rounds=1 must reproduce P7's max arm exactly; that is gated by
# tests/test_iterated_vote.py, so any difference between arms is the number of
# exchanges and not the loop itself. Pre-registered at 0d9b386.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: polybrains_5lm
  - /monty/sensor_module: 5sm_noisy_subset
  - /monty/connectivity: 5lm_5sm
  - /environment: mujoco_dist_agent_sensors5
  - /env_interface: eval_distinctobj_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: missing_depthto3d_sensor6
  - /logging: basic_warning_monty_runs

polybrains:
  # in-domain rotations, per PREDICTIONS.md
  # OOD: oblique poses held out of training, per PREDICTIONS.md
  eval_rotations:
    - [35, 45, 0]
    - [325, 45, 0]
    - [35, 315, 0]
    - [325, 315, 0]
  vote_mode: max
  vote_rounds: 2
  consensus_tau: 0.15
  adaptive_weight: false

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    monty_config:
      monty_class: ${monty.class:polybrains.iterated_vote.IteratedVotingMonty}
      monty_args:
        vote_rounds: 2
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 1
    do_train: false
    do_eval: true
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}}/polybrains/pb_indomain_5lm/pretrained/
    n_eval_epochs: 1
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 3
    seed: 42
    eval_env_interface_args:
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations: ${polybrains.eval_rotations}
    supervised_lm_ids: []
    logging:
      run_name: p9_r2
      monty_handlers:
        - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler}
