# @package _global_
# 1-LM pretraining on the same 5 in-domain rotations as the 5-LM model.
# Required for H1: without a single-frame arm, H1 is untested rather than
# underpowered.
defaults:
  - /monty: graph_exp500_e3_t3_tot2500
  - /monty/motor_system_config: naive_scan_1
  - /monty/learning_module: displacement_1lm
  - /monty/sensor_module: camera_dist
  - /monty/connectivity: 1lm_1sm
  - /environment: mujoco_ycb_dist_agent
  - /env_interface: train_distinctobj_predefined
  - /env_interface/positioning_procedures_train: getgoodview_viewfinder_patch
  - /env_interface/transform: missing_depthto3d_sensor2_semantic0
  - /logging: silent_info_train

experiment:
  _target_: tbp.monty.frameworks.experiments.pretraining_experiments.MontySupervisedObjectPretrainingExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 20000
    n_train_epochs: 5
    model_name_or_path: ''
    n_eval_epochs: 1
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 1
    seed: 42
    supervised_lm_ids: all
    train_env_interface_args:
      object_init_sampler:
        rotations:
          - [0, 0, 0]
          - [0, 90, 0]
          - [0, 270, 0]
          - [90, 0, 0]
          - [90, 180, 0]
    logging:
      run_name: pb_indomain_1lm
      output_dir: ${path.expanduser:${oc.env:MONTY_MODELS}/polybrains}
