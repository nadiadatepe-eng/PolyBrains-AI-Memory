# @package _global_
# P12 -- H2: w(t) frozen -- upstream control
#
# H2 was NEVER RUN before this: adaptive_weight was false in 24 of 24 configs and
# record_episode_outcome was called nowhere outside tests. See the 2026-08-19
# audit in PREDICTIONS.md. Gated by tests/test_adaptive_weight.py, which fails
# if outcomes stop reaching w(t).
defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: polybrains_5lm
  - /monty/sensor_module: 5sm_noisy_subset
  - /monty/connectivity: 5lm_5sm
  - /environment: mujoco_dist_agent_sensors5
  - /env_interface: eval_distinctobj_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: missing_depthto3d_sensor6
  - /logging: basic_warning_monty_runs

polybrains:
  # in-domain rotations, per PREDICTIONS.md
  # OOD: oblique poses held out of training, per PREDICTIONS.md
  # The 5 rotations pb_indomain_5lm was pretrained on. Episodes at
  # these rotations let confidence accumulate; they are EXCLUDED from
  # the accuracy denominator by tools/analyse_p12.py.
  indomain_rotations:
    - [0, 0, 0]
    - [0, 90, 0]
    - [0, 270, 0]
    - [90, 0, 0]
    - [90, 180, 0]
  # Mixed schedule: 5 in-domain + 4 OOD, one rotation per epoch.
  eval_rotations:
    - [0, 0, 0]
    - [0, 90, 0]
    - [0, 270, 0]
    - [90, 0, 0]
    - [90, 180, 0]
    - [35, 45, 0]
    - [325, 45, 0]
    - [35, 315, 0]
    - [325, 315, 0]
  vote_mode: consensus
  consensus_tau: 0.15
  adaptive_weight: false

experiment:
  _target_: polybrains.adaptive_experiment.AdaptiveWeightExperiment
  weight_source: frozen
  indomain_rotations: ${polybrains.indomain_rotations}
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 1
    do_train: false
    do_eval: true
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}}/polybrains/pb_indomain_5lm/pretrained/
    n_eval_epochs: 1
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 3
    seed: 42
    eval_env_interface_args:
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations: ${polybrains.eval_rotations}
    supervised_lm_ids: []
    logging:
      run_name: p12_frozen
      monty_handlers:
        - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler}
