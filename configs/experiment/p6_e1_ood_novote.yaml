# @package _global_
# P4: the CLEAN H1 test. Identical to e1_ood_max in every respect except that
# lm_to_lm_vote_matrix is null, so the 5 modules never exchange votes. Same
# model, same training, same capacity -- one variable.
# E0 -- replication arm. Stock behaviour (vote_mode=max, static weight) running
# through OUR learning module, so the baseline shares a code path with every
# other arm. Trains and evaluates on the 5 in-domain rotations.
defaults:
  - /monty: evidencegraph_exp1000_emin_t3_tot2500
  - /monty/motor_system_config: distant_5
  - /monty/learning_module: polybrains_5lm
  - /monty/sensor_module: 5sm_camera_dist_noise
  - /monty/connectivity: 5lm_5sm
  - /environment: mujoco_dist_agent_spread5
  - /env_interface: eval_distinctobj_random
  - /env_interface/positioning_procedures_eval: getgoodview_viewfinder_patch0
  - /env_interface/transform: missing_depthto3d_sensor6
  - /logging: basic_warning_monty_runs

polybrains:
  # in-domain rotations, per PREDICTIONS.md
  # OOD: oblique poses held out of training, per PREDICTIONS.md
  eval_rotations:
    - [35, 45, 0]
    - [325, 45, 0]
    - [35, 315, 0]
    - [325, 315, 0]
  vote_mode: max
  consensus_tau: 0.15
  adaptive_weight: false

experiment:
  _target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
  config:
    show_sensor_output: false
    max_train_steps: 1000
    max_eval_steps: 500
    max_total_steps: 6000
    n_train_epochs: 1
    do_train: false
    do_eval: true
    model_name_or_path: ${path.expanduser:${oc.env:MONTY_MODELS}}/polybrains/pb_indomain_5lm/pretrained/
    n_eval_epochs: 1
    match_criterion:
      _target_: tbp.monty.experiment.match_criteria.AnyLMsMatch
      count: 3
    seed: 42
    monty_config:
      lm_to_lm_vote_matrix: null
    eval_env_interface_args:
      object_init_sampler:
        _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
        rotations: ${polybrains.eval_rotations}
    supervised_lm_ids: []
    logging:
      run_name: p6_e1_ood_novote
      monty_handlers:
        - ${monty.class:tbp.monty.frameworks.loggers.monty_handlers.BasicCSVStatsHandler}
