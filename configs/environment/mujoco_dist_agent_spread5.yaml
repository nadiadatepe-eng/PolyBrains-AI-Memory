# @package experiment.config.environment
# P6: sensor patches spread 8x wider (0.01 -> 0.08) so the five learning
# modules actually see DIFFERENT parts of the object.
#
# Rationale, from reports/p4-voting-harms.md: at the stock 0.01 separation the
# patches view nearly the same surface, D-index ~= 0.04, and all three vote
# rules are byte-identical. Every hypothesis in this project is about
# DISAGREEING modules, so the stock task cannot test any of them.

env_init_args:
  data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/ycb}
  agents:
    - _target_: tbp.monty.simulators.mujoco.agents.DistantAgent
      _partial_: true
      agent_id: agent_id_0
      sensor_configs:
        patch_0:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - 0.0
            - 0.0
          zoom: 10.0
        patch_1:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - 0.08
            - 0.0
          zoom: 10.0
        patch_2:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - -0.08
            - 0.0
          zoom: 10.0
        patch_3:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.08
            - 0.0
            - 0.0
          zoom: 10.0
        patch_4:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - -0.08
            - 0.0
            - 0.0
          zoom: 10.0
        view_finder:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - 0.0
            - 0.0
          zoom: 1.0
      position:
        - 0.0
        - 1.5
        - 0.2
env_init_func: ${monty.class:tbp.monty.simulators.mujoco.MuJoCoSimulator}
