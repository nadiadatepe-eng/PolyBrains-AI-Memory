# @package experiment.config.environment
# P13: sensor patch separation = 0.0 (stock is 0.01).
#
# H1 clause 2 says the multi-frame advantage tracks DISAGREEMENT, not module
# count. This arm holds the count at 5 and moves the disagreement axis.
#
# MANDATORY: report send_none% (tools/vote_spy.py) for this arm. P6 moved this
# same variable to 0.08 and produced silence, not disagreement -- 88% of votes
# were None. A number from a quiet vote path means nothing.
env_init_args:
  data_path: ${path.expanduser:${oc.env:MONTY_DATA}/mujoco/objects/ycb}
  agents:
    - _target_: tbp.monty.simulators.mujoco.agents.DistantAgent
      _partial_: true
      agent_id: agent_id_0
      sensor_configs:
        patch_0:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - 0.0
            - 0.0
          zoom: 10.0
        patch_1:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - 0.0
            - 0.0
          zoom: 10.0
        patch_2:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - -0.0
            - 0.0
          zoom: 10.0
        patch_3:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - 0.0
            - 0.0
          zoom: 10.0
        patch_4:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - -0.0
            - 0.0
            - 0.0
          zoom: 10.0
        view_finder:
          _target_: tbp.monty.frameworks.sensors.SensorConfig
          resolution:
            width: 64
            height: 64
          position:
            - 0.0
            - 0.0
            - 0.0
          zoom: 1.0
      position:
        - 0.0
        - 1.5
        - 0.2
env_init_func: ${monty.class:tbp.monty.simulators.mujoco.MuJoCoSimulator}
