# @package experiment.config.monty_config.sensor_modules
# P7: induce genuine DISAGREEMENT without absence.
#
# Sensor modules 3 and 4 get 5-10x the stock noise; 0, 1, 2 stay clean. Patch
# positions are UNCHANGED at the stock 0.01 separation, so every module stays
# on the object and keeps voting. This is the fix for P6's failure, where
# spreading the patches silenced 88% of votes instead of making modules
# disagree (reports/p6-spread-sensors.md).
#
# Mandatory check when using this: report send_none% from tools/vote_spy.py
# alongside accuracy. A result from a silent vote path means nothing.

sensor_module_0:
  _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
  sensor_module_id: patch_0
  features: ${constants.default_sensor_features}
  save_raw_obs: false
  delta_thresholds:
    on_object: 0
    distance: 0.01
  noise_params: ${constants.default_all_noise_params}
sensor_module_1:
  _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
  sensor_module_id: patch_1
  features: ${constants.default_sensor_features}
  save_raw_obs: false
  delta_thresholds:
    on_object: 0
    distance: 0.01
  noise_params: ${constants.default_all_noise_params}
sensor_module_2:
  _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
  sensor_module_id: patch_2
  features: ${constants.default_sensor_features}
  save_raw_obs: false
  delta_thresholds:
    on_object: 0
    distance: 0.01
  noise_params: ${constants.default_all_noise_params}
sensor_module_3:
  _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
  sensor_module_id: patch_3
  features: ${constants.default_sensor_features}
  save_raw_obs: false
  delta_thresholds:
    on_object: 0
    distance: 0.01
  noise_params:
    features:
      pose_vectors: 20      # 10x stock rotation noise
      hsv: 0.5              # 5x stock colour noise
      principal_curvatures_log: 0.5
      pose_fully_defined: 0.1
    location: 0.01          # 5x stock location noise
sensor_module_4:
  _target_: tbp.monty.frameworks.models.sensor_modules.CameraSM
  sensor_module_id: patch_4
  features: ${constants.default_sensor_features}
  save_raw_obs: false
  delta_thresholds:
    on_object: 0
    distance: 0.01
  noise_params:
    features:
      pose_vectors: 20      # 10x stock rotation noise
      hsv: 0.5              # 5x stock colour noise
      principal_curvatures_log: 0.5
      pose_fully_defined: 0.1
    location: 0.01          # 5x stock location noise
sensor_module_5:
  _target_: tbp.monty.frameworks.models.salience.sensor_module.SalienceSM
  sensor_module_id: view_finder
  save_raw_obs: true
